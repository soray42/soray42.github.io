<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><filter id="paper" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="6" stitchTiles="stitch" result="noise"/><feColorMatrix type="saturate" values="0" in="noise" result="gray"/><feComponentTransfer in="gray" result="subtle"><feFuncA type="linear" slope="0.16" intercept="0"/></feComponentTransfer></filter><filter id="fibers" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.01 0.4" numOctaves="2" seed="3" stitchTiles="stitch" result="fnoise"/><feColorMatrix type="saturate" values="0" in="fnoise" result="fgray"/><feComponentTransfer in="fgray" result="fsubtle"><feFuncA type="linear" slope="0.11" intercept="0"/></feComponentTransfer></filter></defs><rect width="100%" height="100%" filter="url(#paper)" fill="rgb(160,150,135)"/><rect width="100%" height="100%" filter="url(#fibers)" fill="rgb(140,130,115)"/></svg>
